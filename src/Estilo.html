<style>
:root{
  --bg:#F1F4F5; --surface:#FFFFFF; --surface-2:#F2F6F7; --line:#E3E9EB; --campo:#AEBBBF;
  --ink:#1B2A2F; --ink-2:#4A5A60; --ink-3:#5B6A71;
  --accent:#1F5F74; --accent-ink:#FFFFFF; --accent-soft:#E2EEF1;
  --ok:#2E7550; --ok-soft:#DDEFE4; --warn:#8A5710; --warn-soft:#F6E9CF; --crit:#A8322D; --crit-soft:#F6DCDA;
  --info-soft:#E4E6F4; --info:#3F4C8C; --vio:#5B4A9E; --vio-soft:#ECE8F6;
  --r:16px; --borda-cartao:transparent; --seg-on:var(--surface); --badge-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(16,40,48,.04),0 8px 24px rgba(16,40,48,.06);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0F181B; --surface:#172328; --surface-2:#1D2B31; --line:#26363C; --campo:#4A5F66;
  --ink:#E6EEF0; --ink-2:#AFBEC3; --ink-3:#93A4AA;
  --accent:#6FB3C8; --accent-ink:#0D1A1F; --accent-soft:#1D3840;
  --ok:#7CC89C; --ok-soft:#1D3528; --warn:#E3B061; --warn-soft:#3A2E17; --crit:#EE8A83; --crit-soft:#3E1F1D;
  --info-soft:#262B47; --info:#A8B2EC; --vio:#B7A8EE; --vio-soft:#2A2545;
  --borda-cartao:var(--line); --seg-on:var(--accent-soft); --badge-ink:#1B0F0E; --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F181B; --surface:#172328; --surface-2:#1D2B31; --line:#26363C; --campo:#4A5F66;
  --ink:#E6EEF0; --ink-2:#AFBEC3; --ink-3:#93A4AA;
  --accent:#6FB3C8; --accent-ink:#0D1A1F; --accent-soft:#1D3840;
  --ok:#7CC89C; --ok-soft:#1D3528; --warn:#E3B061; --warn-soft:#3A2E17; --crit:#EE8A83; --crit-soft:#3E1F1D;
  --info-soft:#262B47; --info:#A8B2EC; --vio:#B7A8EE; --vio-soft:#2A2545;
  --borda-cartao:var(--line); --seg-on:var(--accent-soft); --badge-ink:#1B0F0E; --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
h2{font-size:16px;font-weight:700}
h3{font-size:13px;font-weight:600}
.mono{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}

/* shell */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--surface);box-shadow:1px 0 0 var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 6px}
.brand .logo{flex:none;width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:12.5px;letter-spacing:.02em}
.brand div{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand b{font-size:15px}
.brand span{font-size:12px;color:var(--ink-3)}
/* menu: seções, ícone em cada item e Casos com os atalhos sempre à vista */
nav{display:flex;flex-direction:column;gap:2px}
.nav-sec{font-size:11.5px;color:var(--ink-3);padding:12px 12px 4px}
.nav-sec:first-child{padding-top:4px}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--ink-2);font-weight:500}
nav button svg{flex:none}
nav button .lbl{flex:1}
nav button:hover{background:var(--surface-2)}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav button:focus-visible{outline:2px solid var(--accent)}
nav .count{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
nav button.sub{padding:6px 12px 6px 40px;font-size:13.5px}
.who{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:0 4px}
.main{padding-block:24px 60px;padding-inline:28px;min-width:0}
/* barra de ícones à direita do título de cada tela (flutua: o título ocupa o resto da linha) */
.barra{float:right;display:flex;align-items:center;gap:10px;margin:0 0 12px 16px}
.ib{all:unset;cursor:pointer;width:40px;height:40px;box-sizing:border-box;border-radius:12px;background:var(--surface);border:1px solid var(--borda-cartao);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink-2);position:relative}
.ib:hover{color:var(--accent)}
.ib:focus-visible{outline:2px solid var(--accent)}
.ib .badge{position:absolute;top:-5px;right:-6px;min-width:18px;box-sizing:border-box;text-align:center;background:var(--crit);color:var(--badge-ink);font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 5px;line-height:16px}
.ib .badge.warn{background:var(--warn)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.top p{margin:4px 0 0;color:var(--ink-2);max-width:62ch}

/* controls */
.btn{cursor:pointer;border:1px solid var(--campo);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:5px 10px;font-size:12.5px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{background:var(--surface);border:1px solid var(--campo);border-radius:10px;padding:8px 10px;width:100%}
textarea{min-height:76px;resize:vertical}
.field{display:flex;flex-direction:column;gap:5px}
.field > span{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field small{color:var(--ink-3);font-size:11.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--borda-cartao);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-triagem{background:var(--info-soft);color:var(--info)}
.p-avaliacao{background:var(--warn-soft);color:var(--warn)}
.p-acompanhamento{background:var(--accent-soft);color:var(--accent)}
.p-encerrado{background:var(--surface-2);color:var(--ink-3)}
.p-crit{background:var(--crit-soft);color:var(--crit)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.prio{font-family:var(--mono);font-size:11px;font-weight:500;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--ink-2)}
.prio.p1{border-color:var(--crit);color:var(--crit)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--borda-cartao);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px}
.kpi:hover{border-color:var(--accent)}
.kpi b{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--ink-2)}
.kpi.alert b{color:var(--crit)}
.tab-tec tr.total td{font-weight:700;border-top:2px solid var(--line)}
.alist{display:flex;flex-direction:column}
.aitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.aitem:first-child{border-top:0}
.aitem:hover .nm{text-decoration:underline}
.nm{font-weight:600}
.sev{width:4px;height:32px;border-radius:2px}
.sev.crit{background:var(--crit)} .sev.warn{background:var(--warn)} .sev.info{background:var(--info)}

/* table */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--borda-cartao);border-radius:var(--r);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:760px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.filters input{max-width:280px}
.filters select{width:auto}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:12px;background:var(--surface-2)}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:9px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--seg-on);color:var(--accent);font-weight:700;box-shadow:0 1px 3px rgba(16,40,48,.12)}
.seg button:focus-visible{outline:2px solid var(--accent)}

/* case detail */
.steps{display:flex;gap:0;margin:6px 0 20px;overflow-x:auto}
.step{flex:1;min-width:110px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink-3)}
.step .bar{height:4px;background:var(--line);border-radius:2px;margin-right:4px}
.step.done .bar{background:var(--accent)} .step.done{color:var(--ink-2)}
.step.now .bar{background:var(--accent)} .step.now{color:var(--ink);font-weight:700}
.detail{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
.detail > *{min-width:0}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
dt{color:var(--ink-3);font-size:12.5px}
dd{margin:0;font-weight:500}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 12px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.diag fieldset{border:0;padding:0;margin:0 0 16px}
.diag legend{font-weight:700;margin-bottom:6px}
.diag .sub{font-size:12px;font-weight:600;color:var(--ink-3);margin:8px 0 4px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:5px 0;cursor:pointer}
.chk input{width:auto;margin-top:3px;accent-color:var(--accent)}
.timeline{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .when{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.ev .tag{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.dup{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:13px}
.dup b{color:var(--warn)}
.vit{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{border:1px solid var(--line);border-radius:9px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;background:var(--surface)}
.opt input{width:auto;margin-top:3px;accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt b{display:block}
.opt small{color:var(--ink-2)}
.outcomes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.outcomes button{text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:12px}
.outcomes button:hover{border-color:var(--accent)}
.outcomes button b{display:block;margin-bottom:2px}
.outcomes button small{color:var(--ink-2)}
.outcomes button.main-o{border-color:var(--accent);background:var(--accent-soft)}

/* charts */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.vbars{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:18px;border-bottom:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 25%;background-position:0 18px}
.vbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.vbar i{display:block;width:70%;max-width:34px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.vbar:hover i{filter:brightness(1.15)}
.vbar em{font-style:normal;font-size:11px;font-variant-numeric:tabular-nums;color:var(--ink-2);margin-bottom:3px}
.xl{display:flex;gap:6px;margin-top:6px}
.xl span{flex:1;text-align:center;font-size:11px;color:var(--ink-3)}
.hbars{display:flex;flex-direction:column;gap:8px}
.hb.w{grid-template-columns:minmax(0,1.7fr) minmax(40px,1fr) 64px}
.hb.w span{white-space:normal;line-height:1.3}
.hb b small{font-weight:400;color:var(--ink-3);font-size:11.5px}
.vbar s{position:absolute;left:12%;right:12%;height:0;border-top:2px dashed var(--ink-3);pointer-events:none}
.legenda{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.lg-barra{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent)}
.lg-ref{display:inline-block;width:14px;border-top:2px dashed var(--ink-3)}
td.calor{background:color-mix(in srgb,var(--accent) calc(var(--a,0)*55%),transparent);font-weight:600}
.kpi b small{font-size:14px;font-weight:500;color:var(--ink-2)}
.hb{display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;font-size:12.5px}
.hb .track{height:14px;background:var(--surface-2);border-radius:0 4px 4px 0}
.hb .track i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.hb b{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.hb span{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;box-shadow:var(--shadow);z-index:20}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,25,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{background:var(--surface);border-radius:var(--r);padding:20px;width:min(460px,100%);display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.modal.larga{width:min(680px,100%)}
.viol-lista{column-count:2;column-gap:22px}
.outra-box{margin-top:10px}
.outra-box[hidden]{display:none}
.viol-lista .chk{break-inside:avoid}
@media (max-width:620px){.viol-lista{column-count:1}}
/* a lista é longa: os botões ficam sempre à vista no pé da janela */
.modal.larga > .row:last-child{position:sticky;bottom:-20px;background:var(--surface);padding:12px 0 0;border-top:1px solid var(--line);margin-top:2px}
.modal .diag fieldset{margin:0 0 12px}
.empty{color:var(--ink-3);padding:14px 0}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .seg{flex-wrap:wrap}
  .filters input{max-width:none;width:100%}
  .charts{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:column;gap:10px;padding:12px 16px;border-right:0;border-bottom:1px solid var(--line)}
  nav{flex-direction:row;overflow-x:auto;gap:4px}
  nav button{white-space:nowrap}
  nav .count{margin-left:6px}
  .who{margin-top:0;flex-direction:row;align-items:center}
  .proto{display:none}
  .main{padding-inline:16px}
  .detail{grid-template-columns:minmax(0,1fr)}
  /* no celular, um desfecho por linha e compacto: nome e explicação lado a lado */
  .outcomes{grid-template-columns:minmax(0,1fr);gap:6px}
  .outcomes button{padding:9px 12px;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px}
  .outcomes button b{margin-bottom:0}
  .outcomes button small{font-size:12px}
  .sub-fixo{min-height:4.5em}
  .vit{grid-template-columns:1fr 1fr}
  .hb{grid-template-columns:110px 1fr 30px}
}
/* aguardando repasse é uma etapa normal: cor própria, não a de alerta */
.p-repasse{background:var(--vio-soft);color:var(--vio)}
.carregando{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:30;flex-direction:column;gap:10px;color:var(--ink-2)}
.ocupado{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:16px;background:var(--ink);color:var(--bg);padding:6px 12px;border-radius:6px;font-size:12.5px;font-weight:600;z-index:25}
.erro-total{max-width:520px;margin:15vh auto;padding:24px}
.whoami{font-size:12.5px;color:var(--ink-2);word-break:break-all}
.whoami b{display:block;color:var(--ink);font-size:13px}
.nw{white-space:nowrap}
.num-link{all:unset;cursor:pointer;border-radius:4px;padding:0 3px}
.num-link:hover,.num-link:focus-visible{background:var(--accent-soft);text-decoration:underline}
.filters select{width:auto;max-width:100%}
.copiar{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-left:3px;border-radius:5px;color:var(--ink-3);vertical-align:middle}
.copiar:hover,.copiar:focus-visible{color:var(--accent);background:var(--accent-soft)}
.copiar:focus-visible{outline:2px solid var(--accent)}
.copiar.ok{color:var(--ok)}
h1 .copiar{width:28px;height:28px;margin-left:6px}
h1 .copiar svg{width:18px;height:18px}
.gbusca{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow-y:auto}
.gbusca-item{all:unset;cursor:pointer;display:flex;flex-direction:column;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.gbusca-item:hover,.gbusca-item:focus-visible{border-color:var(--accent);background:var(--accent-soft)}
.gbusca-item .muted{font-size:12px}
/* painel de gravação em segundo plano, no modelo da caixa de uploads do Drive */
.fila{position:fixed;right:16px;bottom:0;z-index:60;width:340px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;box-shadow:0 -2px 16px rgba(20,40,45,.16);overflow:hidden}
.fila[hidden]{display:none}
.fila-cab{display:flex;align-items:center;gap:4px;padding:9px 8px 9px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px;font-weight:600}
.fila-cab span{flex:1}
.fila-ico{all:unset;cursor:pointer;padding:2px 7px;border-radius:5px;color:var(--ink-3)}
.fila-ico:hover{background:var(--line);color:var(--ink)}
.fila-ico[hidden]{display:none}
.fila.recolhido #fila-recolher{transform:rotate(180deg)}
.fila.recolhido .fila-itens{display:none}
.fila-itens{list-style:none;margin:0;padding:0;max-height:260px;overflow-y:auto}
.fila-item{display:flex;align-items:flex-start;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:13px}
.fila-item:last-child{border-bottom:0}
.fila-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.fila-txt .muted{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila-texto{margin-top:4px;font-size:12px;color:var(--ink-2);white-space:pre-wrap}
.fila-motivo{margin-top:4px;font-size:12px;color:var(--crit)}
