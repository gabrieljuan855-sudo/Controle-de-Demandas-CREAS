<script>
/* ================= utilidades ================= */
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/\s+/g, ' ').trim();
const D = s => { if (!s) return null; const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };
const iso = d => d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` : '';
let HOJE = new Date(); HOJE.setHours(0,0,0,0);
const fmt = s => { const d = s instanceof Date ? s : D(s); return d ? d.toLocaleDateString('pt-BR') : '—'; };
const fmtC = s => { const d = s instanceof Date ? s : D(s); return d ? d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) : '—'; };
const dias = s => { const d = s instanceof Date ? s : D(s); return d ? Math.round((HOJE - d)/864e5) : 0; };
const idade = s => { const n = D(s); if (!n) return ''; let a = HOJE.getFullYear()-n.getFullYear(); if (HOJE < new Date(HOJE.getFullYear(), n.getMonth(), n.getDate())) a--; return a; };
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }

/* chamada ao servidor (Apps Script) como Promise */
let ocupados = 0;
function run(fn, ...args){
  ocupados++; mostrarOcupado();
  return new Promise((ok, falha) => {
    google.script.run
      .withSuccessHandler(r => { ocupados--; mostrarOcupado(); ok(r); })
      .withFailureHandler(e => { ocupados--; mostrarOcupado(); toast(e && e.message ? e.message : String(e)); falha(e); })[fn](...args);
  });
}
function mostrarOcupado(){
  let el = $('#ocupado');
  if (ocupados > 0 && !el){ el = document.createElement('div'); el.id='ocupado'; el.className='ocupado'; el.textContent='Salvando…'; document.body.appendChild(el); }
  if (ocupados <= 0 && el) el.remove();
}

/* ================= fila de gravação em segundo plano =================
   A mudança aparece na tela na hora e a gravação segue por trás, uma de cada vez
   e na ordem em que foi feita. Reenvio automático é seguro: registros e discussões
   levam um id gerado aqui, e o servidor não grava o mesmo id duas vezes.
   Nada some calado: o que falhar fica no painel com "Tentar de novo". */
const FILA = [];
let FILA_VOANDO = false, FILA_TIMER = null;
const FILA_ESPERAS = [2000, 5000, 12000], FILA_SUMICO_MS = 5000;
const idUnico = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2,10);
/* juntar: mudanças seguidas do mesmo tipo (ex.: marcar vários itens do diagnóstico) viram um pedido só */
function salvar(c, rotulo, fn, args, juntar, texto){
  if (juntar){ const p = FILA.find(i => i.juntar===juntar && i.estado==='pendente' && !i.voando); if (p){ p.args = args; renderFila(); return; } }
  FILA.unshift({chave:idUnico(), caso:c.id, nome:nomeCaso(c), rotulo, fn, args, juntar, texto:texto||'', estado:'pendente', tentativas:0, motivo:'', esperando:false, voando:false, salvoEm:0});
  renderFila(); processarFila();
}
function processarFila(){
  if (FILA_VOANDO) return;
  // do mais antigo ao mais novo; um caso com gravação que falhou segura as seguintes dele,
  // senão o "Tentar de novo" regravaria um estado antigo por cima de um mais novo
  let item = null; const travados = new Set();
  for (let i = FILA.length-1; i >= 0; i--){
    const it = FILA[i];
    if (it.estado==='falhou') travados.add(it.caso);
    else if (it.estado==='pendente' && !travados.has(it.caso)){ item = it; break; }
  }
  if (!item || item.esperando){ renderFila(); return; }
  FILA_VOANDO = item.voando = true; renderFila();
  google.script.run
    .withSuccessHandler(r => { FILA_VOANDO = item.voando = false; concluirItem(item, r); })
    .withFailureHandler(e => { FILA_VOANDO = item.voando = false; replicar(item, e && e.message ? e.message : String(e)); })
    [item.fn](...item.args);
}
function concluirItem(item, r){
  item.estado = 'salvo'; item.salvoEm = Date.now(); item.motivo = '';
  // com outra gravação do mesmo caso ainda na fila, a resposta desta ficaria atrasada em relação à tela
  if (r && r.id && !FILA.some(i => i.caso===item.caso && i.estado==='pendente')){ substituir(r); if (podeRepintar()) render(); else renderNav(); }
  renderFila(); processarFila();
}
function replicar(item, motivo){
  item.motivo = motivo;
  if (item.tentativas >= FILA_ESPERAS.length){ item.estado = 'falhou'; renderFila(); processarFila(); return; }
  const espera = FILA_ESPERAS[item.tentativas++];
  item.esperando = true; renderFila();
  setTimeout(() => { item.esperando = false; processarFila(); }, espera);
}
/* não repinta por cima de algo que a pessoa está digitando */
function podeRepintar(){
  if (S.view==='novo') return false;
  const a = document.activeElement;
  if (a && a.id!=='busca' && a.closest && a.closest('#main') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return false;
  return ![...document.querySelectorAll('#main textarea, #main input:not([type]), #main input[type=text]')].some(el => el.id!=='busca' && el.value.trim());
}
const filaConta = e => FILA.filter(i => i.estado===e).length;
function renderFila(){
  const p = $('#fila'); if (!p) return;
  if (!FILA.length){ p.hidden = true; return; }
  p.hidden = false;
  const pend = filaConta('pendente'), falhas = filaConta('falhou');
  $('#fila-titulo').textContent = falhas && !FILA_VOANDO ? (falhas===1 ? '1 alteração não foi salva' : `${falhas} alterações não foram salvas`)
    : pend ? (pend===1 ? 'Salvando 1 alteração' : `Salvando ${pend} alterações`)
    : falhas ? (falhas===1 ? '1 alteração não foi salva' : `${falhas} alterações não foram salvas`) : 'Tudo salvo';
  $('#fila-fechar').hidden = pend > 0;
  const presos = new Set(), comFalha = new Set();
  for (let k = FILA.length-1; k >= 0; k--){ const it = FILA[k]; if (it.estado==='falhou') comFalha.add(it.caso); else if (it.estado==='pendente' && comFalha.has(it.caso)) presos.add(it.chave); }
  $('#fila-itens').innerHTML = FILA.map(i => `<li class="fila-item">
    <span class="fila-txt"><b>${esc(i.rotulo)}</b><span class="muted">${esc(i.nome)} · ${esc(i.caso)}</span>
    ${i.estado==='falhou'&&i.texto?`<span class="fila-texto">${esc(i.texto)}</span>`:''}
    ${presos.has(i.chave)?'<span class="fila-texto">Aguardando a alteração deste caso que não foi salva.</span>':''}
    ${i.motivo&&i.estado!=='salvo'?`<span class="fila-motivo">${i.estado==='falhou'?'':'Tentando de novo: '}${esc(i.motivo)}</span>`:''}
    ${i.estado==='falhou'?`<span class="row" style="gap:6px;margin-top:6px"><button type="button" class="btn small primary" data-fre="${i.chave}">Tentar de novo</button><button type="button" class="btn small" data-fdesc="${i.chave}">Descartar</button></span>`:''}</span>
    <span class="fila-marca ${i.estado}">${i.estado==='salvo'?'✓':i.estado==='falhou'?'!':''}</span></li>`).join('');
  clearTimeout(FILA_TIMER);
  if (FILA.some(i => i.estado==='salvo')) FILA_TIMER = setTimeout(() => {
    const agora = Date.now();
    for (let i = FILA.length-1; i >= 0; i--) if (FILA[i].estado==='salvo' && agora - FILA[i].salvoEm >= FILA_SUMICO_MS) FILA.splice(i,1);
    renderFila();
  }, FILA_SUMICO_MS);
}
function iniciarFila(){
  const p = $('#fila'); if (!p) return;
  $('#fila-recolher').onclick = () => p.classList.toggle('recolhido');
  $('#fila-fechar').onclick = () => { for (let i = FILA.length-1; i >= 0; i--) if (FILA[i].estado!=='pendente') FILA.splice(i,1); renderFila(); };
  $('#fila-itens').onclick = e => {
    const re = e.target.closest('[data-fre]'), de = e.target.closest('[data-fdesc]');
    const item = FILA.find(i => i.chave===(re ? re.dataset.fre : de ? de.dataset.fdesc : ''));
    if (!item) return;
    if (re){ Object.assign(item, {estado:'pendente', tentativas:0, motivo:''}); renderFila(); processarFila(); return; }
    if (!confirm('Descartar esta alteração? Ela não foi salva e será perdida.')) return;
    FILA.splice(FILA.indexOf(item), 1); renderFila();
    // volta a tela para o que está de fato gravado na planilha
    google.script.run.withSuccessHandler(c => { if (c){ substituir(c); if (podeRepintar()) render(); } }).api_caso(item.caso);
  };
  window.addEventListener('beforeunload', e => { if (!filaConta('pendente') && !filaConta('falhou')) return; e.preventDefault(); e.returnValue = ''; return ''; });
}

/* ================= constantes ================= */
const ETAPAS = {triagem:'Aguardando triagem', avaliacao:'Em avaliação social', repasse:'Aguardando repasse', acompanhamento:'Em acompanhamento', encerrado:'Encerrado'};
const COMPLEX = {0.5:'Baixa (0,5)', 1:'Média (1)', 1.5:'Alta (1,5)'};
const DIAG = [
  {g:'1. Violências físicas, psicológicas e morais', itens:[['fis','Violência física'],['psi','Violência psicológica'],['mor','Violência moral'],['pat','Violência patrimonial'],['ins','Violência institucional']]},
  {g:'2. Violências sexuais e exploração', itens:[['sex','Abuso/violência sexual'],['exp','Exploração sexual, de imagem ou relacionados']]},
  {g:'3. Negligência', itens:[
    ['ng1','Negligência severa e persistente, com prejuízo grave ao desenvolvimento da criança ou idoso'],
    ['ng2','Recusa deliberada ou omissão grave nos cuidados (saúde, alimentação, higiene, proteção)'],
    ['ng3','Infrequência ou evasão escolar associada a negligência familiar grave'],
    ['ng4','Negligência associada a outras violações de direitos'],
    ['pbf','Descumprimento de condicionalidades do PBF e do PETI com violação de direitos']]},
  {g:'4. Abandono ou ausência de cuidado', subs:[
    {s:'Crianças e adolescentes', itens:[['ca1','Deixado sem supervisão ou cuidados adequados'],['ca2','Abandono pelos responsáveis legais'],['ca3','Desaparecimento intencional dos responsáveis'],['ca4','Rompimento de vínculos por negligência ou violência'],['ti','Trabalho infantil']]},
    {s:'Pessoas idosas', itens:[['id1','Idoso abandonado em hospital, residência, instituição ou espaço público']]},
    {s:'Pessoas com deficiência, transtornos ou dependência química', itens:[['pd1','Pessoa com deficiência em abandono ou desassistência familiar'],['pd2','Pessoa com transtorno mental ou dependência química abandonada pela família']]},
    {s:'Situações gerais', itens:[['sg1','Abandono de criança, adolescente, PcD ou idoso, mesmo que eventual'],['sg2','Desvinculação familiar reiterada, com acompanhamentos anteriores sem mudança']]}]},
  {g:'5. Discriminações e violações de direitos', itens:[['dso','Discriminação por orientação sexual'],['dre','Discriminação por raça/etnia']]}
];
const DIAG_LABEL = {}, DIAG_GRUPO = {};
DIAG.forEach(g => (g.itens || g.subs.flatMap(s => s.itens)).forEach(([k,l]) => { DIAG_LABEL[k]=l; DIAG_GRUPO[k]=g.g.replace(/^\d\.\s*/,''); }));
const DESFECHOS_AVAL = [
  ['indicar_acompanhamento','Indicar acompanhamento','Coordenação escolhe a técnica'],
  ['Contrarreferenciado ao CRAS','Contrarreferenciar ao CRAS','Sem violação que justifique PAEFI'],
  ['Denúncia não confirmada — respondido ao órgão','Não confirmado','Responder ao órgão e encerrar'],
  ['Não localizado','Não localizado','Após tentativas registradas'],
  ['Encaminhado a outro serviço','Outro serviço','CAPS, saúde, CRM…'],
  ['Arquivado','Arquivar','Não é demanda do CREAS']
];

/* ================= estado ================= */
let DB = { papel:'', email:'', casos:[], ges:null, listas:{} };
const S = { view:'painel', caso:null, tab:'dados', filtroEtapa:'ativos', busca:'', draft:null, editando:null, gTec:'', gPrevia:null, prev:'painel' };
const coord = () => DB.papel === 'coordenacao';
const aval = () => DB.papel === 'avaliacao';
const TECNICAS = () => (DB.listas.tecnicas || []);
function substituir(c){ const i = DB.casos.findIndex(x => x.id === c.id); if (i >= 0) DB.casos[i] = c; else DB.casos.unshift(c); }
function go(view, extra={}){ Object.assign(S, {view}, extra); render(); window.scrollTo(0,0); }

/* ================= GESUAS: cruzamento ================= */
const PART = new Set(['DE','DA','DO','DOS','DAS','E']);
const toks = s => norm(s).replace(/[^A-Z ]/g,' ').split(' ').filter(t => t && !PART.has(t));
function mesmoNome(a,b){
  const A=toks(a), B=toks(b);
  if (A.length<2 || B.length<2 || A[0]!==B[0]) return false;
  const sa=new Set(A), sb=new Set(B); const [sm,bg] = sa.size<=sb.size ? [sa,sb] : [sb,sa];
  let n=0; sm.forEach(t => { if (bg.has(t)) n++; });
  return n>=2 && n>=Math.min(sm.size,3);
}
const primeiroNome = s => toks(s)[0] || '';
const TIT = s => String(s||'').toLowerCase().replace(/(^|\s)\S/g, m => m.toUpperCase()).replace(/\b(De|Da|Do|Dos|Das|E)\b/g, m => m.toLowerCase());
const temGes = () => DB.ges && DB.ges.linhas && DB.ges.linhas.length > 0;
const nomesCaso = c => [c.responsavel, ...c.pessoas.map(p => p.nome)].filter(Boolean);
const sobrenomes = s => toks(s).slice(1).filter(t => t.length >= 3);
const rejeitados = c => new Set(String(c.gesuas_rejeitados||'').split('|').filter(Boolean).map(norm));
const soDig = s => String(s||'').replace(/\D/g,'');
const fmtCpf = s => { const d = soDig(s); return d.length===11 ? `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6,9)}-${d.slice(9)}` : d; };
/* atendimentos importados do GESUAS, indexados por CPF e por nome do responsável */
let ATEND_CACHE = null;
function atendIdx(){
  if (ATEND_CACHE && ATEND_CACHE.src===DB.atend) return ATEND_CACHE;
  const porCpf = new Map(), porNome = new Map(); let min = '';
  const add = (m, k, a) => { if (!m.has(k)) m.set(k, []); m.get(k).push(a); };
  (DB.atend||[]).forEach(a => { if (a.cpf) add(porCpf, a.cpf, a); add(porNome, norm(a.responsavel), a); if (a.data && (!min || a.data < min)) min = a.data; });
  return ATEND_CACHE = {src:DB.atend, porCpf, porNome, min};
}
const temAtend = () => (DB.atend||[]).length > 0;
/* dias de histórico de atendimentos importado: abaixo de 60, "sem atendimento há 60 dias" não é confiável */
const coberturaAtend = () => { const m = atendIdx().min; return m ? dias(m) : 0; };
function atendimentosDaFamilia(g){
  const I = atendIdx(), cpf = soDig(g.cpf);
  return [...new Set([...(cpf ? I.porCpf.get(cpf)||[] : []), ...(I.porNome.get(norm(g.responsavel))||[])])].sort((a,b) => a.data < b.data ? -1 : 1);
}
const ultimoAtend = g => { const l = atendimentosDaFamilia(g); return l.length ? l[l.length-1].data : ''; };
function semAtendimento(g){
  if (!temAtend() || coberturaAtend() < 60) return false;
  const u = ultimoAtend(g); return u ? dias(u) > 60 : dias(dataBr(g.inicio)) > 60;
}
function noGesuas(c){
  if (!temGes()) return null;
  const pessoas = nomesCaso(c), rej = rejeitados(c);
  const cpf = soDig(c.cpf);
  if (cpf.length===11){ const g = DB.ges.linhas.find(g => soDig(g.cpf)===cpf && !rej.has(norm(g.responsavel))); if (g) return g; }
  return DB.ges.linhas.find(g => !rej.has(norm(g.responsavel)) && pessoas.some(p => mesmoNome(p, g.responsavel))) || null;
}
/* mesmo sobrenome: só entra se for da mesma técnica ou tiver 2 sobrenomes em comum */
function candidatosSobrenome(c){
  const sc = new Set(nomesCaso(c).flatMap(sobrenomes)); if (!sc.size) return [];
  const rej = rejeitados(c);
  return DB.ges.linhas.filter(g => !rej.has(norm(g.responsavel)))
    .map(g => ({g, n: new Set(sobrenomes(g.responsavel).filter(t => sc.has(t))).size, tec: primeiroNome(g.tecnico) === primeiroNome(c.tecnica)}))
    .filter(x => x.n && (x.tec || x.n >= 2))
    .sort((a,b) => (b.tec - a.tec) || (b.n - a.n)).slice(0,5).map(x => x.g);
}
/* técnica da lista do sistema com o mesmo primeiro nome; senão, o nome como está no GESUAS */
const nomeTecnica = t => TECNICAS().find(x => primeiroNome(x)===primeiroNome(t)) || TIT(t);
/* em acompanhamento, vale a técnica que incluiu a família no GESUAS; antes disso, a indicada no repasse */
function tecnicaRef(c){ const s = statusGes(c); return s && s.tipo==='ok' ? nomeTecnica(s.g.tecnico) : c.tecnica; }
const dataBr = s => { const m = String(s||'').match(/(\d\d)\/(\d\d)\/(\d{4})/); return m ? `${m[3]}-${m[2]}-${m[1]}` : ''; };
/* famílias do relatório que não correspondem a nenhum caso em acompanhamento */
function linhasSoGesuas(){
  if (!temGes()) return [];
  const usadas = new Set();
  DB.casos.forEach(c => { const s = statusGes(c); if (s && s.tipo==='ok') usadas.add(s.g); });
  return DB.ges.linhas.filter(g => !usadas.has(g));
}
/* casos que estavam no relatório atual e não aparecem no novo */
function casosQueSaem(novas){
  const antes = DB.casos.filter(c => { const s = statusGes(c); return s && s.tipo==='ok'; });
  const velho = DB.ges; DB.ges = {...velho, linhas: novas};
  try { return antes.filter(c => { const s = statusGes(c); return !(s && s.tipo==='ok'); }); } finally { DB.ges = velho; }
}
function statusGes(c){
  if (!temGes() || c.etapa !== 'acompanhamento') return null;
  if (c.gesuas_vinculo === '*') return {tipo:'manual'};
  const conf = c.gesuas_vinculo ? DB.ges.linhas.find(x => norm(x.responsavel) === norm(c.gesuas_vinculo)) : null;
  const g = conf || noGesuas(c);
  if (g) return {tipo:'ok', g, confirmado: !!conf, paf: g.paf};
  const cand = candidatosSobrenome(c);
  if (cand.length) return {tipo:'possivel', cand, dias: dias(c.inicio_acomp)};
  return {tipo:'ausente', dias: dias(c.inicio_acomp)};
}

/* leitura do PDF "Famílias Acompanhadas por Técnico" (pdf.js) */
async function lerPdfGesuas(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  const ev=[]; let headerY=null, headerPage=null, periodo='';
  const OPS = pdfjsLib.OPS;
  const mul=(m,n)=>[m[0]*n[0]+m[2]*n[1], m[1]*n[0]+m[3]*n[1], m[0]*n[2]+m[2]*n[3], m[1]*n[2]+m[3]*n[3], m[0]*n[4]+m[2]*n[5]+m[4], m[1]*n[4]+m[3]*n[5]+m[5]];
  const ap=(m,x,y)=>[m[0]*x+m[2]*y+m[4], m[1]*x+m[3]*y+m[5]];
  for (let pi=1; pi<=pdf.numPages; pi++){
    const page = await pdf.getPage(pi);
    const vp = page.getViewport({scale:1}); const H = vp.viewBox[3]-vp.viewBox[1];
    const ol = await page.getOperatorList();
    let ctm=[1,0,0,1,0,0]; const st=[];
    for (let i=0;i<ol.fnArray.length;i++){
      const fn=ol.fnArray[i], a=ol.argsArray[i];
      if (fn===OPS.save) st.push(ctm.slice());
      else if (fn===OPS.restore) ctm=st.pop()||[1,0,0,1,0,0];
      else if (fn===OPS.transform) ctm=mul(ctm,a);
      else if (fn===OPS.constructPath){
        const ops=a[0], args=a[1]; let k=0;
        for (const op of ops){
          if (op===OPS.rectangle){
            const [x,y,w,h]=args.slice(k,k+4); k+=4;
            const p1=ap(ctm,x,y), p2=ap(ctm,x+w,y+h);
            const x0=Math.min(p1[0],p2[0]), x1=Math.max(p1[0],p2[0]), y0=Math.min(p1[1],p2[1]), y1=Math.max(p1[1],p2[1]);
            // linha horizontal fina na coluna "Técnico" = troca de técnico
            if (x0<32 && x1>138 && x1<160 && (y1-y0)<2.2){ const top=H-y1; if (top>=0 && top<=H) ev.push({pi,y:top,k:'B'}); }
          } else if (op===OPS.moveTo || op===OPS.lineTo) k+=2;
          else if (op===OPS.curveTo) k+=6;
          else if (op===OPS.curveTo2 || op===OPS.curveTo3) k+=4;
        }
      }
    }
    const tc = await page.getTextContent();
    for (const it of tc.items){
      const s = it.str.trim(); if (!s) continue;
      const x = it.transform[4], y = H - it.transform[5] - (it.height||8)*0.8;
      if (/^P+A+F+$/.test(s) && headerY===null){ headerY=y; headerPage=pi; }
      const mp = s.match(/(\d\d\/\d\d\/\d{4})\s*a\s*(\d\d\/\d\d\/\d{4})/); if (mp && !periodo) periodo = `${mp[1]} a ${mp[2]}`;
      ev.push({pi,y,k:'T',x,s});
    }
  }
  if (headerY===null) throw new Error('Não encontrei a tabela "Famílias Acompanhadas por Técnico" neste PDF.');
  ev.sort((a,b) => a.pi-b.pi || a.y-b.y);
  let seg=-1, lastB=null; const labels={}, rows=[], frag=[];
  const DATE=/(\d\d\/\d\d\/\d{4})/;
  for (const e of ev){
    if (e.pi<headerPage || (e.pi===headerPage && e.y<=headerY+6)) continue;
    if (e.k==='B'){ if (lastB && lastB.pi===e.pi && Math.abs(lastB.y-e.y)<4) continue; lastB=e; seg++; continue; }
    if (seg<0) continue;
    if (e.x<146){ (labels[seg]=labels[seg]||[]).push({y:e.y,s:e.s}); continue; }
    if (e.x>=268 && e.x<300 && DATE.test(e.s)){ rows.push({seg,pi:e.pi,y:e.y,inicio:e.s.match(DATE)[1],nome:[],serv:[],paf:[]}); continue; }
    frag.push(e);
  }
  for (const f of frag){
    const cand = rows.filter(r => r.pi===f.pi); if (!cand.length) continue;
    let best=cand[0]; for (const r of cand) if (Math.abs(r.y-f.y) < Math.abs(best.y-f.y)) best=r;
    const dy=Math.abs(best.y-f.y), ultimo=cand[cand.length-1];
    if (dy>13 && !(best===ultimo && f.y>ultimo.y && dy<24)) continue;
    if (f.x>=510) best.paf.push(f.s); else if (f.x>=355) best.serv.push(f.s); else best.nome.push(f);
  }
  const out=[];
  for (const r of rows){
    const nome = r.nome.sort((a,b)=>(Math.round(a.y)-Math.round(b.y))||(a.x-b.x)).map(f=>f.s).join(' ').replace(/\s+/g,' ').trim();
    const tecnico = (labels[r.seg]||[]).sort((a,b)=>a.y-b.y).map(l=>l.s).join(' ').replace(/\s+/g,' ').trim() || 'Sem técnico identificado';
    const o = {tecnico, responsavel:nome, inicio:r.inicio, servico:r.serv.join(' ').replace(/\s+/g,' ').trim()||'PAEFI', paf:r.paf.join(' ').trim(), seg:r.seg};
    const prev = out[out.length-1];
    if (prev && prev.seg===o.seg && prev.inicio===o.inicio && (prev.responsavel.startsWith(o.responsavel) || o.responsavel.startsWith(prev.responsavel))){
      if (o.responsavel.length > prev.responsavel.length) out[out.length-1]=o; continue;
    }
    if (o.responsavel) out.push(o);
  }
  if (!out.length) throw new Error('O PDF abriu, mas nenhuma família foi lida. Confira se é o relatório "Famílias Acompanhadas por Técnico".');
  return {origem:file.name, periodo, linhas: out.map(({seg,...r}) => r)};
}

/* relatórios do GESUAS exportados em .xls (são tabelas HTML); o PDF de "Acompanhadas por Técnico" continua aceito */
const TIPOS_REL = {acompanhadas:'Famílias Acompanhadas por Técnico', acompanhamentos:'Acompanhamentos', atendimentos:'Famílias Atendidas por Técnico'};
async function lerRelatorioGesuas(file){
  if (/\.pdf$/i.test(file.name) || file.type==='application/pdf'){
    if (!window.pdfjsLib) throw new Error('O leitor de PDF não carregou. Verifique a conexão e recarregue a página.');
    return {tipo:'acompanhadas', ...(await lerPdfGesuas(file))};
  }
  const doc = new DOMParser().parseFromString(await file.text(), 'text/html');
  const titulo = norm(doc.title), txt = (doc.body ? doc.body.textContent : '').replace(/\s+/g,' ');
  const mp = txt.match(/(\d\d\/\d\d\/\d{4})\s*a\s*(\d\d\/\d\d\/\d{4})/);
  const base = {origem:file.name, periodo: mp ? `${mp[1]} a ${mp[2]}` : ''};
  const L = [...doc.querySelectorAll('tbody tr')].map(tr => [...tr.cells].map(td => td.textContent.replace(/\s+/g,' ').trim()));
  if (/ACOMPANHADAS POR TECNICO/.test(titulo)){
    let tec = ''; const out = [];
    // o técnico aparece uma vez por grupo (célula que ocupa várias linhas)
    L.forEach(r => { if (r.length>=5){ tec = r[0]; r = r.slice(1); } if (r.length===4 && r[0] && /\d\d\/\d\d\/\d{4}/.test(r[1])) out.push({tecnico:tec, responsavel:r[0], inicio:r[1], servico:r[2]||'PAEFI', paf:r[3]}); });
    if (!out.length) throw new Error(`Nenhuma família lida em "${file.name}".`);
    return {...base, tipo:'acompanhadas', linhas:out};
  }
  if (/ATENDIDAS POR TECNICO/.test(titulo)){
    let tec = ''; const out = [], vezes = {};
    L.forEach(r => { if (r.length>=9){ tec = r[0]; r = r.slice(1); } if (r.length!==8 || !/\d\d\/\d\d\/\d{4}/.test(r[7])) return;
      const data = dataBr(r[7]), k = `${norm(tec)}|${norm(r[0])}|${data}`; vezes[k] = (vezes[k]||0) + 1;
      // a mesma família atendida duas vezes no dia pela mesma técnica conta duas; reimportar o período não duplica
      out.push({chave:`${k}#${vezes[k]}`, tecnico:tec, responsavel:r[0], cpf:soDig(r[1]), nis:soDig(r[2]), bairro:r[5], data}); });
    if (!out.length) throw new Error(`Nenhum atendimento lido em "${file.name}".`);
    return {...base, tipo:'atendimentos', linhas:out};
  }
  if (/EM ACOMPANHAMENTO/.test(titulo)){
    const out = L.filter(r => r.length>=6 && r[0]).map(r => ({responsavel:r[0], cpf:soDig((r[1].match(/CPF:\s*([\d.\-]+)/)||[])[1]), nis:soDig((r[1].match(/NIS:\s*(\d+)/)||[])[1]),
      endereco:r[2].replace(/\s*Nº:\s*(Não informado)?\s*$/i,'').replace(/\s*Nº:\s*/,', '), bairro:r[3]}));
    if (!out.length) throw new Error(`Nenhuma família lida em "${file.name}".`);
    return {...base, tipo:'acompanhamentos', linhas:out};
  }
  throw new Error(`"${file.name}" não é um dos relatórios reconhecidos: ${Object.values(TIPOS_REL).join(', ')}.`);
}
/* completa CPF, NIS, bairro e endereço das famílias do GESUAS a partir de outra lista */
function enriquecer(linhas, fonte){
  if (!fonte.length) return;
  const porNome = new Map(fonte.map(a => [norm(a.responsavel), a]));
  linhas.forEach(g => { const a = porNome.get(norm(g.responsavel)) || fonte.find(a => mesmoNome(a.responsavel, g.responsavel));
    if (a) ['cpf','nis','bairro','endereco'].forEach(k => { if (a[k] && !g[k]) g[k] = a[k]; }); });
}
/* casos com dado vazio que o GESUAS pode preencher (nunca sobrescreve o que foi digitado) */
function casosACompletar(linhas){
  const velho = DB.ges; DB.ges = {...(velho||{}), linhas};
  try {
    return DB.casos.map(c => { const s = statusGes(c); if (!s || s.tipo!=='ok') return null; const g = s.g, campos = {};
      if (!c.responsavel) campos.responsavel = TIT(g.responsavel);
      if (!soDig(c.cpf) && g.cpf && (!c.responsavel || mesmoNome(c.responsavel, g.responsavel))) campos.cpf = fmtCpf(g.cpf);
      if (!c.endereco && g.endereco) campos.endereco = g.endereco;
      if (!c.bairro && g.bairro) campos.bairro = TIT(g.bairro);
      return Object.keys(campos).length ? {id:c.id, campos} : null; }).filter(Boolean);
  } finally { DB.ges = velho; }
}
async function montarPrevia(files){
  const lidos = []; for (const f of files) lidos.push(await lerRelatorioGesuas(f));
  const acd = lidos.find(x => x.tipo==='acompanhadas'), acs = lidos.filter(x => x.tipo==='acompanhamentos').flatMap(x => x.linhas);
  const prev = {arquivos:lidos.map(x => ({nome:x.origem, tipo:x.tipo, n:x.linhas.length, periodo:x.periodo})),
    saem:[], desligar:new Set(), completar:[], atendimentos:lidos.filter(x => x.tipo==='atendimentos').flatMap(x => x.linhas), semBase:false};
  let linhas = null;
  if (acd){ linhas = acd.linhas; if (temGes()) enriquecer(linhas, DB.ges.linhas.filter(g => g.cpf || g.bairro)); }
  else if (acs.length && temGes()) linhas = DB.ges.linhas.map(g => ({...g}));
  else if (acs.length) prev.semBase = true;
  if (linhas){
    enriquecer(linhas, acs);
    prev.ges = {origem: acd ? acd.origem : DB.ges.origem, periodo: acd ? acd.periodo : DB.ges.periodo, linhas};
    if (acd && temGes()){ prev.saem = casosQueSaem(linhas).map(c => c.id); prev.desligar = new Set(prev.saem); }
    prev.completar = casosACompletar(linhas);
    prev.comDoc = linhas.filter(g => g.cpf || g.bairro).length;
  }
  return prev;
}

/* ================= alertas ================= */
function ultimaMov(c){ return c.registros.length ? c.registros[c.registros.length-1].data : c.recebido; }
function alertas(){
  const a=[];
  DB.casos.forEach(c => {
    if (coord() && c.prazo && !c.prazo_respondido && c.etapa!=='encerrado'){
      const r = -dias(c.prazo);
      if (r<0) a.push({sev:'crit',c,t:`Prazo de resposta vencido há ${-r} dia${-r>1?'s':''}`,s:`${c.remetente} · ${c.doc_tipo} ${c.doc_num}`});
      else if (r<=7) a.push({sev:'warn',c,t:`Prazo de resposta em ${r} dia${r!==1?'s':''} (${fmtC(c.prazo)})`,s:`${c.remetente} · ${c.doc_tipo} ${c.doc_num}`});
    }
    if (coord() && c.etapa==='triagem') a.push({sev:'info',c,t:'Aguardando triagem',s:`Recebido em ${fmt(c.recebido)}`});
    if (coord() && c.etapa==='repasse') a.push({sev:'warn',c,t:'Avaliação indicou acompanhamento: escolher a técnica',s:`Concluída em ${fmt(c.desfecho_data)}`});
    if (c.etapa==='avaliacao' && dias(ultimaMov(c))>30) a.push({sev:'warn',c,t:`Avaliação sem movimentação há ${dias(ultimaMov(c))} dias`,s:`Recebido em ${fmt(c.recebido)}`});
    if (coord() && c.etapa==='acompanhamento'){
      const g = statusGes(c);
      if (g && g.tipo==='possivel') a.push({sev:'info',c,t:'Possível família no GESUAS pelo sobrenome: conferir',s:`Técnica: ${c.tecnica}`});
      if (g && g.tipo==='ausente') a.push({sev:g.dias>7?'crit':'warn',c,t:`Repassado há ${g.dias} dias e não está no GESUAS`,s:`Técnica: ${c.tecnica}`});
      if (g && g.tipo==='ok' && g.paf!=='Preenchido') a.push({sev:'info',c,t:'PAF em branco no GESUAS',s:`Técnica: ${tecnicaRef(c)}`});
    }
  });
  const ord={crit:0,warn:1,info:2}; return a.sort((x,y) => ord[x.sev]-ord[y.sev]);
}

/* ícone de copiar ao lado de nomes, para colar na busca do GESUAS */
const ICONE_COPIAR = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';
const cp = t => t ? `<button type="button" class="copiar" data-copiar="${esc(t)}" title="Copiar" aria-label="Copiar ${esc(t)}">${ICONE_COPIAR}</button>` : '';
const comCopia = t => { if (!t) return ''; const s = String(t).trim(), i = s.lastIndexOf(' '); return `${esc(s.slice(0, i+1))}<span class="nw">${esc(s.slice(i+1))}${cp(s)}</span>`; };
/* mostra um texto e copia outro (nome do GESUAS: mostra em Título, copia como está no relatório) */
const comCopiaComo = (mostra, copia) => { const i = mostra.lastIndexOf(' '); return `${esc(mostra.slice(0, i+1))}<span class="nw">${esc(mostra.slice(i+1))}${cp(copia)}</span>`; };
const vitimasComCopia = c => c.pessoas.length ? c.pessoas.map(p => comCopia(p.nome)).join(', ') : '—';
async function copiarTexto(t){
  try { await navigator.clipboard.writeText(t); return true; } catch(e){}
  const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly',''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch(e){} ta.remove(); return ok;
}
/* captura antes dos cliques de linha/cartão: copiar não abre o caso */
function iniciarCopiar(){
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('[data-copiar]'); if (!b) return;
    e.preventDefault(); e.stopPropagation();
    copiarTexto(b.dataset.copiar).then(ok => {
      toast(ok ? `Copiado: ${b.dataset.copiar}` : 'Não foi possível copiar. Selecione o nome e use Ctrl+C.');
      if (ok){ b.classList.add('ok'); setTimeout(() => b.classList.remove('ok'), 1200); }
    });
  }, true);
  document.addEventListener('keydown', e => { if ((e.key==='Enter' || e.key===' ') && e.target.closest && e.target.closest('[data-copiar]')) e.stopPropagation(); }, true);
}

/* busca o caso a que pertence uma família do GESUAS: sugere pelo nome e filtra enquanto digita */
function vincularLinhaModal(g){
  const sug = () => { const vistos = new Set(), out = [];
    const sg = new Set(sobrenomes(g.responsavel));
    [...DB.casos.filter(c => nomesCaso(c).some(n => mesmoNome(n, g.responsavel))),
     ...DB.casos.filter(c => nomesCaso(c).flatMap(sobrenomes).some(t => sg.has(t)))].forEach(c => { if (!vistos.has(c.id)){ vistos.add(c.id); out.push(c); } });
    return out.slice(0,8); };
  const achar = q => { const t = norm(q).split(' ').filter(Boolean); if (!t.length) return sug();
    return DB.casos.filter(c => t.every(x => norm([...nomesCaso(c), c.id].join(' ')).includes(x))).slice(0,8); };
  const item = c => `<button type="button" class="gbusca-item" data-cpick="${c.id}"><b>${esc(nomeCaso(c))} <span class="mono muted">${c.id}</span></b><span class="muted">${c.responsavel?'Resp.: '+esc(c.responsavel)+' · ':''}${ETAPAS[c.etapa]||c.etapa}</span></button>`;
  const lista = q => { const r = achar(q);
    if (!r.length) return `<div class="muted" style="padding:8px 2px">${q.trim()?'Nenhum caso com esse nome.':'Nenhuma sugestão pelo nome. Digite o nome da vítima, do responsável ou o nº do caso.'}</div>`;
    return (q.trim()?'':'<div class="muted" style="font-size:12px">Sugestões pelo nome:</div>') + r.map(item).join(''); };
  modal(`<h2>Vincular a um caso</h2><p class="muted" style="margin:0">No GESUAS: ${comCopiaComo(TIT(g.responsavel), g.responsavel)} · ${esc(nomeTecnica(g.tecnico))} · início ${esc(g.inicio)}</p>
    <label class="field"><span>Buscar caso</span><input id="cbusca" autocomplete="off" placeholder="Nome da vítima, do responsável ou nº do caso"></label>
    <div id="cbusca-res" class="gbusca">${lista('')}</div>`,
    () => criarCasoDoGesuas(g), 'Não existe: criar caso', '');
  const inp = $('#cbusca'), res = $('#cbusca-res');
  inp.oninput = () => { res.innerHTML = lista(inp.value); };
  res.onclick = e => { const b = e.target.closest('[data-cpick]'); if (!b) return;
    vincularLinha(DB.casos.find(x => x.id===b.dataset.cpick), g); $('#layer').innerHTML=''; render(); toast('Família vinculada ao caso'); };
  inp.onkeydown = e => { if (e.key==='Enter'){ e.preventDefault(); const b = res.querySelector('[data-cpick]'); if (b) b.click(); } };
}
function prazoCell(c){
  if (!c.prazo) return '<span class="muted">—</span>';
  if (c.prazo_respondido) return `<span class="muted">${fmtC(c.prazo)} ✓</span>`;
  const r = -dias(c.prazo);
  const col = r<0?'var(--crit)':r<=7?'var(--warn)':'var(--ink-2)';
  return `<span style="color:${col};font-weight:600">${fmtC(c.prazo)}</span>`;
}

function draft(){

  const c = S.editando ? DB.casos.find(x => x.id===S.editando) : null;
  S.draft = c ? {
    responsavel:c.responsavel, cpf:c.cpf||'', pessoas:(c.pessoas.length?c.pessoas:[{nome:'',nascimento:'',sexo:''}]).map(p=>({...p})),
    endereco:c.endereco||'', bairro:c.bairro||'', contato:c.contato||'', remetente:c.remetente||'', remetente_detalhe:c.remetente_detalhe||'',
    doc_tipo:c.doc_tipo||'Ofício', doc_num:c.doc_num||'', recebido:c.recebido||'', prazo:c.prazo||'', descricao:c.descricao||'', prioridade:String(c.prioridade||2)
  } : {
    responsavel:'', cpf:'', pessoas:[{nome:'',nascimento:'',sexo:''}], endereco:'', bairro:'', contato:'', remetente:'', remetente_detalhe:'',
    doc_tipo:'Ofício', doc_num:'', recebido:iso(HOJE), prazo:'', descricao:'', prioridade:'2', destino:'avaliacao', tecnica:TECNICAS()[0]||'', complexidade:'1'
  };
  return S.draft;
}
function duplicados(nome){
  const q = norm(nome); if (q.length<4) return [];
  const partes = toks(nome);
  return DB.casos.filter(c => c.id!==S.editando && [c.responsavel, ...c.pessoas.map(p=>p.nome)].some(n => partes.length>=2 ? mesmoNome(nome,n) || norm(n).includes(q) : norm(n).includes(q))).slice(0,6);
}
function duplicadosDraft(Dd){
  const vistos = new Set(), out = [];
  [...Dd.pessoas.map(p => p.nome), Dd.responsavel].forEach(n => duplicados(n||'').forEach(c => { if (!vistos.has(c.id)){ vistos.add(c.id); out.push(c); } }));
  return out.slice(0,6);
}

function dupHtml(dup){

const CAMPOS_EDITAVEIS = ['responsavel','cpf','endereco','bairro','contato','remetente','remetente_detalhe','doc_tipo','doc_num','recebido','prazo','descricao','prioridade'];
async function salvarNovo(){
  const Dd = draft();
  if (!Dd.pessoas.some(p => String(p.nome||'').trim()) || !Dd.remetente || !Dd.descricao.trim() || !Dd.recebido){ toast('Preencha vítima, remetente, data de recebimento e descrição.'); return; }
  const btn = $('#fNovo button[type=submit]'); btn.disabled = true;
  try {
    if (S.editando){
      const {pessoas, ...campos} = Dd;
      const c = DB.casos.find(x => x.id===S.editando);
      CAMPOS_EDITAVEIS.forEach(k => { if (k in campos) c[k] = campos[k]; });
      c.prioridade = Number(campos.prioridade) || 2;
      c.pessoas = pessoas.filter(p => String(p.nome||'').trim()).map(p => ({...p, nome:p.nome.trim()}));
      salvar(c, 'Dados do caso', 'api_editarCaso', [c.id, campos, pessoas]);
      S.draft=null; S.editando=null; go('caso',{caso:c.id,tab:'dados'});
    } else {
      const c = await run('api_novoCaso', Dd);
      substituir(c); S.draft=null; toast(`Caso ${c.id} registrado`); go('caso',{caso:c.id,tab:'dados',prev:'painel'});
    }
  } catch(e){ btn.disabled = false; }
}

/* ================= modais ================= */
function modal(html, onOk, rotuloOk='Confirmar', classeOk='primary'){
  $('#layer').innerHTML = `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">${html}<div class="row" style="justify-content:flex-end"><button class="btn" data-mx>Cancelar</button><button class="btn ${classeOk}" data-mok>${rotuloOk}</button></div></div></div>`;
  const fechar = () => $('#layer').innerHTML='';
  $('#layer [data-mx]').onclick = fechar;
  $('#layer .modal-bg').onclick = e => { if (e.target.classList.contains('modal-bg')) fechar(); };
  $('#layer [data-mok]').onclick = async () => {
    const b = $('#layer [data-mok]'); b.disabled = true;
    try { const c = await onOk(); if (c){ substituir(c); fechar(); render(); } else b.disabled = false; } catch(e){ b.disabled = false; }
  };
  const f = $('#layer input, #layer select, #layer textarea'); if (f) f.focus();
}
const campoTecnica = () => `<label class="field"><span>Técnica de referência</span><select id="m_tec">${opcoes(TECNICAS(), '')}</select></label>
  <label class="field"><span>Complexidade</span><select id="m_cx"><option value="0.5">Baixa (0,5)</option><option value="1" selected>Média (1)</option><option value="1.5">Alta (1,5)</option></select></label>`;
/* aplicam na tela, na hora, a mesma mudança que o servidor vai gravar */
function repassarLocal(c, t, cx){ Object.assign(c, {etapa:'acompanhamento', tecnica:t, complexidade:Number(cx)||1, inicio_acomp:iso(HOJE), desfecho:'Passado para acompanhamento', desfecho_data:iso(HOJE)}); }
function encerrarLocal(c, desfecho, obs){ Object.assign(c, {etapa:'encerrado', desfecho, desfecho_data:iso(HOJE), desfecho_obs:obs||''}); }
function acao(c, tipo){
  if (tipo==='p_aval') return modal(`<h2>Enviar para avaliação social</h2><p style="margin:0">${esc(nomeCaso(c))} entra na fila da avaliação com os dados do encaminhamento.</p>`,

  if (tipo==='p_acomp') return modal(`<h2>Repassar para acompanhamento</h2><p class="muted" style="margin:0">${esc(nomeCaso(c))} · registros e diagnóstico seguem junto.</p>${campoTecnica()}`,
    async () => { const t=$('#m_tec').value, cx=$('#m_cx').value; repassarLocal(c, t, cx); S.tab='acomp'; salvar(c, `Repasse a ${t}`, 'api_encaminhar', [c.id, 'acompanhamento', t, cx]); return c; });
  if (tipo==='indicar_acompanhamento'){

      async () => { const t=$('#m_tec').value, cx=$('#m_cx').value, obs=$('#m_obs').value; repassarLocal(c, t, cx); c.desfecho_obs=obs; salvar(c, `Avaliação concluída · repasse a ${t}`, 'api_desfecho', [c.id, 'indicar_acompanhamento', obs, t, cx], null, obs); return c; });
    return modal(`<h2>Indicar acompanhamento</h2><p style="margin:0">A coordenação vai escolher a técnica de referência.</p><label class="field"><span>Observação para a coordenação</span><textarea id="m_obs" placeholder="Ex.: situação de risco, sugestão de técnica pelo território"></textarea></label>`,
      async () => { const obs=$('#m_obs').value; Object.assign(c, {etapa:'repasse', desfecho:'Indicado acompanhamento', desfecho_data:iso(HOJE), desfecho_obs:obs}); salvar(c, 'Indicado acompanhamento', 'api_desfecho', [c.id, 'indicar_acompanhamento', obs], null, obs); return c; });
  }
  if (tipo==='deslig') return modal(`<h2>Desligar do acompanhamento</h2><label class="field"><span>Motivo</span><select id="m_mot"><option>Superação da situação de violação</option><option>Contrarreferenciado ao CRAS</option><option>Mudança de município</option><option>Recusa / não adesão</option><option>Óbito</option><option>Outro</option></select></label><label class="field"><span>Observação</span><textarea id="m_obs"></textarea></label>`,
    async () => { const mot=$('#m_mot').value, obs=$('#m_obs').value; encerrarLocal(c, 'Desligado: '+mot, obs); c.desligamento=iso(HOJE); salvar(c, 'Desligamento', 'api_desligar', [c.id, mot, obs], null, obs); return c; });
  return modal(`<h2>${esc(tipo)}</h2><label class="field"><span>Observação</span><textarea id="m_obs" placeholder="Ex.: respondido ofício nº…"></textarea></label>`,
    async () => { const obs=$('#m_obs').value; encerrarLocal(c, tipo, obs); salvar(c, 'Desfecho: '+tipo, 'api_desfecho', [c.id, tipo, obs], null, obs); return c; });
}

/* ================= conferência GESUAS ================= */
function tecnicasGes(){
  const mapa = new Map();
  (DB.ges && DB.ges.linhas || []).forEach(g => { const k=primeiroNome(g.tecnico); if (!mapa.has(k)) mapa.set(k, TIT(g.tecnico)); });
  TECNICAS().forEach(t => { const k=primeiroNome(t); if (k && !mapa.has(k)) mapa.set(k, t); });
  return [...mapa.entries()].map(([k,nome]) => ({k,nome}));
}
function pendencias(k){
  const acomp = DB.casos.filter(c => c.etapa==='acompanhamento' && primeiroNome(c.tecnica)===k);
  const st = acomp.map(c => ({c, s:statusGes(c)})).filter(x => x.s);
  const ausentes = st.filter(x => x.s.tipo==='ausente').map(x => x.c).sort((a,b) => String(b.inicio_acomp).localeCompare(String(a.inicio_acomp)));
  const possiveis = st.filter(x => x.s.tipo==='possivel');
  const doGes = (DB.ges && DB.ges.linhas || []).filter(g => primeiroNome(g.tecnico)===k);
  const pafBranco = doGes.filter(g => g.paf!=='Preenchido');
  const soGes = linhasSoGesuas().filter(g => primeiroNome(g.tecnico)===k);
  const semAtend = doGes.filter(semAtendimento);
  return {ausentes, possiveis, doGes, pafBranco, soGes, semAtend};
}
function resumoTecnicas(){ return tecnicasGes().map(t => ({...t, ...pendencias(t.k)})).filter(t => t.doGes.length || t.ausentes.length || t.possiveis.length); }
/* botões de conferência manual com o GESUAS */
const gvBtn = (c, acao, rotulo, nome='', cls='') => `<button type="button" class="btn small ${cls}" data-gv="${acao}" data-gcaso="${c.id}" data-gnome="${esc(nome)}">${rotulo}</button>`;
function conferirHtml(c, s){
  return `<div class="stack" style="gap:6px">${s.cand.map(g => `<div class="row" style="justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line)">
    <div><b>${comCopiaComo(TIT(g.responsavel), g.responsavel)}</b><div class="muted" style="font-size:12.5px">${esc(TIT(g.tecnico))} · início ${esc(g.inicio)}</div></div>
    <div class="row" style="gap:6px">${gvBtn(c,'confirmar','É esta família',g.responsavel,'primary')}${gvBtn(c,'rejeitar','Não é',g.responsavel)}</div></div>`).join('')}
    ${s.cand.length>1?`<div style="padding-top:6px;border-top:1px solid var(--line)">${gvBtn(c,'rejeitar',`Nenhuma destas ${s.cand.length} famílias`,s.cand.map(g => g.responsavel).join('|'))}</div>`:''}</div>`;
}
function tabelaTecnicas(R){
  return `<div style="overflow-x:auto"><table style="min-width:0"><thead><tr><th>Técnica</th><th style="text-align:right">No GESUAS</th><th style="text-align:right">PAF em branco</th><th style="text-align:right">Não registrados</th></tr></thead><tbody>
  ${R.map(t => `<tr data-gtec="${t.k}"><td>${esc(t.nome.split(' ')[0])}</td><td class="mono" style="text-align:right">${t.doGes.length}</td><td class="mono" style="text-align:right;${t.pafBranco.length?'color:var(--warn);font-weight:600':''}">${t.pafBranco.length}</td><td class="mono" style="text-align:right;${t.ausentes.length?'color:var(--crit);font-weight:600':''}">${t.ausentes.length}</td></tr>`).join('')}</tbody></table></div>`;

function vincularGesuas(c, acao, nome){
  if (acao==='confirmar') c.gesuas_vinculo = nome;
  if (acao==='manual') c.gesuas_vinculo = '*';
  if (acao==='rejeitar'){ const novos = nome.split('|'); c.gesuas_rejeitados = [...new Set([...String(c.gesuas_rejeitados||'').split('|').filter(Boolean), ...novos])].join('|'); if (novos.includes(c.gesuas_vinculo)) c.gesuas_vinculo=''; }
  if (acao==='desfazer'){ c.gesuas_vinculo=''; c.gesuas_rejeitados=''; }
  salvar(c, {confirmar:'GESUAS: família vinculada', rejeitar: nome.includes('|') ? 'GESUAS: nenhuma das sugeridas' : 'GESUAS: não é esta família', manual:'GESUAS: está no GESUAS', desfazer:'GESUAS: conferência desfeita'}[acao], 'api_vinculoGesuas', [c.id, acao, nome]);
}
/* "está no GESUAS com outro nome": digita e a lista do relatório vai filtrando; um clique vincula */
function buscarNoGesuas(c){
  const achar = q => {
    const t = norm(q).split(' ').filter(Boolean); if (!t.length) return [];
    return DB.ges.linhas.filter(g => t.every(x => norm(g.responsavel).includes(x)))
      .sort((a,b) => (primeiroNome(b.tecnico)===primeiroNome(c.tecnica)) - (primeiroNome(a.tecnico)===primeiroNome(c.tecnica)) || a.responsavel.localeCompare(b.responsavel))
      .slice(0,8);
  };
  const lista = q => { const r = achar(q);
    if (!q.trim()) return '<div class="muted" style="padding:8px 2px">Digite parte do nome ou do sobrenome como está no GESUAS.</div>';
    if (!r.length) return '<div class="muted" style="padding:8px 2px">Nenhuma família do relatório com esse nome.</div>';
    return r.map(g => `<button type="button" class="gbusca-item" data-gpick="${esc(g.responsavel)}"><b>${esc(TIT(g.responsavel))}</b><span class="muted">${esc(TIT(g.tecnico))} · início ${esc(g.inicio)}${primeiroNome(g.tecnico)===primeiroNome(c.tecnica)?' · mesma técnica':''}</span></button>`).join(''); };
  modal(`<h2>Vincular à família do GESUAS</h2><p class="muted" style="margin:0">${comCopia(nomeCaso(c))}${c.responsavel&&c.responsavel!==nomeCaso(c)?' · resp.: '+comCopia(c.responsavel):''}</p>
    <label class="field"><span>Nome no GESUAS</span><input id="gbusca" autocomplete="off" placeholder="Ex.: Pereira, Maria Souza"></label>
    <div id="gbusca-res" class="gbusca">${lista('')}</div>`,
    async () => { vincularGesuas(c, 'manual'); return c; }, 'Não achei, confirmar sem vincular', '');
  const inp = $('#gbusca'), res = $('#gbusca-res');
  inp.oninput = () => { res.innerHTML = lista(inp.value); };
  res.onclick = e => { const b = e.target.closest('[data-gpick]'); if (!b) return;
    vincularGesuas(c, 'confirmar', b.dataset.gpick); $('#layer').innerHTML=''; render(); toast('Caso vinculado à família do GESUAS'); };
  inp.onkeydown = e => { if (e.key==='Enter'){ e.preventDefault(); const b = res.querySelector('[data-gpick]'); if (b) b.click(); } };
}
function gesCells(c){
  const s = statusGes(c); if (!s) return '<td class="muted">—</td><td class="muted">—</td>';
  if (s.tipo==='ausente') return `<td><span class="pill p-crit">Não registrado</span><div class="muted" style="font-size:12px">há ${s.dias} dias</div></td><td class="muted">—</td>`;
  if (s.tipo==='possivel') return `<td><span class="pill p-avaliacao">Conferir</span><div class="muted" style="font-size:12px">mesmo sobrenome</div></td><td class="muted">—</td>`;
  if (s.tipo==='manual') return `<td><span class="pill p-ok">Confirmado</span><div class="muted" style="font-size:12px">manualmente</div></td><td class="muted">—</td>`;
  return `<td><span class="pill p-ok">Registrado</span></td><td><span class="pill ${s.paf==='Preenchido'?'p-ok':'p-avaliacao'}">${esc(s.paf||'Em branco')}</span></td>`;
}
function gesBox(c){
  const s = statusGes(c); if (!s) return temGes() ? '' : '<div class="muted">Importe o relatório do GESUAS para ver a situação deste caso.</div>';
  const desfazer = c.gesuas_vinculo || c.gesuas_rejeitados ? gvBtn(c,'desfazer','Desfazer conferência') : '';
  if (s.tipo==='manual') return `<div class="panel stack" style="box-shadow:none;background:var(--surface-2)"><div><span class="label">No GESUAS</span><div style="margin-top:4px">Confirmado manualmente que está em acompanhamento no GESUAS.</div></div><div>${desfazer}</div></div>`;
  if (s.tipo==='possivel') return `<div class="dup stack" style="gap:8px"><div><b>Possível família no GESUAS pelo sobrenome.</b> Confira e confirme:</div>${conferirHtml(c, s)}
    <div class="row" style="gap:6px">${gvBtn(c,'manual','Está no GESUAS com outro nome')}${desfazer}</div></div>`;

/* ================= indicadores ================= */
/* ---------- base de cálculo dos indicadores: só dados que já nascem do trabalho do dia a dia ---------- */
function periodoInd(){
  const y = HOJE.getFullYear(), p = S.indPer || '12m';
  if (p==='ano') return {ini:new Date(y,0,1), fim:HOJE, rot:`em ${y}`, meses:Array.from({length:12},(_,k) => new Date(y,k,1))};
  if (p==='anoAnt') return {ini:new Date(y-1,0,1), fim:new Date(y-1,11,31), rot:`em ${y-1}`, meses:Array.from({length:12},(_,k) => new Date(y-1,k,1))};
  if (p==='tudo') return {ini:null, fim:null, rot:'desde o início', meses:Array.from({length:12},(_,k) => new Date(y,HOJE.getMonth()-11+k,1))};
  return {ini:new Date(y,HOJE.getMonth()-11,1), fim:HOJE, rot:'nos últimos 12 meses', meses:Array.from({length:12},(_,k) => new Date(y,HOJE.getMonth()-11+k,1))};
}
const noPeriodo = (s, P) => { const d = D(s); return !!d && (!P.ini || d >= P.ini) && (!P.fim || d <= P.fim); };
const migrado = c => /^migra/.test(String(c.origem||''));
const diasEntre = (a, b) => { const x = D(a), y = D(b); return x && y ? Math.round((y - x)/864e5) : null; };
const mediana = v => { const a = v.filter(x => x!==null && x>=0).sort((p,q) => p-q); if (!a.length) return null; const m = a.length>>1; return a.length%2 ? a[m] : Math.round((a[m-1]+a[m])/2); };
const pct = (a, b) => b ? Math.round(a/b*100) : null;
const dataHist = (c, re) => { const h = c.historico.filter(x => re.test(String(x.acao))).sort((a,b) => String(a.data_hora).localeCompare(String(b.data_hora)))[0]; return h ? String(h.data_hora).slice(0,10) : ''; };
/* data em que a avaliação social foi concluída (desfecho escolhido pela avaliação) */
function fimAvaliacao(c){
  if (!c.passou_avaliacao) return '';
  return dataHist(c, /^(Avaliação concluída|Desfecho:)/) || (c.desfecho && !/^Desligado/.test(c.desfecho) && c.etapa!=='avaliacao' ? c.desfecho_data : '');
}
function desfechoAval(c){
  const d = String(c.desfecho||'');
  if (c.inicio_acomp || c.etapa==='repasse' || /acompanhamento/i.test(d) || /^Desligado/.test(d)) return 'Indicado acompanhamento';
  const k = DESFECHOS_AVAL.find(x => x[0]===d); return k ? k[1] : (d || 'Sem desfecho');
}
/* reincidência: encaminhamento de vítima/família que já tinha caso anterior */
function reincidentes(C){
  const idx = new Map();
  DB.casos.forEach(c => nomesCaso(c).forEach(n => { const t = toks(n)[0]; if (t){ if (!idx.has(t)) idx.set(t, []); idx.get(t).push({c, n}); } }));
  const out = [];
  C.forEach(c => { const dc = D(c.recebido); if (!dc) return;
    for (const n of nomesCaso(c)){
      const ant = (idx.get(toks(n)[0]) || []).find(x => x.c.id!==c.id && D(x.c.recebido) && D(x.c.recebido) < dc && mesmoNome(n, x.n));
      if (ant){ out.push({c, ant:ant.c}); break; }
    } });
  return out;
}
function vInd(){
  const P = periodoInd();
  const C = DB.casos.filter(c => noPeriodo(c.recebido, P));
  const aval = DB.casos.filter(c => noPeriodo(fimAvaliacao(c), P));
  const cont = arr => { const o={}; arr.forEach(k => { if (k) o[k]=(o[k]||0)+1; }); return Object.entries(o).sort((a,b) => b[1]-a[1]); };
  const hb = (rows, total) => { if (!rows.length) return '<div class="empty">Sem dados no período.</div>'; const mx=Math.max(...rows.map(r=>r[1]));
    return `<div class="hbars">${rows.map(([l,n]) => `<div class="hb${total?' w':''}" title="${esc(l)}: ${n}${total?` (${pct(n,total)}%)`:''}"><span>${esc(l)}</span><div class="track"><i style="width:${n/mx*100}%"></i></div><b>${n}${total?` <small>${pct(n,total)}%</small>`:''}</b></div>`).join('')}</div>`; };
  const semDados = '<span class="muted" style="font-size:16px">sem dados</span>';

  // entradas por mês, com o mesmo mês do ano anterior como referência
  const porMes = P.meses.map(m => { const n = y => DB.casos.filter(c => { const d=D(c.recebido); return d && d.getFullYear()===y && d.getMonth()===m.getMonth(); }).length;
    return {l:m.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''), ano:m.getFullYear(), n:n(m.getFullYear()), ant:n(m.getFullYear()-1)}; });
  const maxM = Math.max(1, ...porMes.flatMap(x => [x.n, x.ant]));

  // tempos (mediana, casos migrados ficam de fora porque não têm as datas reais)
  const tAval = aval.filter(c => !migrado(c)).map(c => diasEntre(c.recebido, fimAvaliacao(c)));
  const tRepasse = DB.casos.filter(c => !migrado(c) && noPeriodo(c.inicio_acomp, P)).map(c => {
    const ind = dataHist(c, /^Avaliação concluída com indicação/), rep = dataHist(c, /^Repassado para acompanhamento/);
    return ind && rep ? diasEntre(ind, rep) : (dataHist(c, /^Avaliação concluída; repassado/) ? 0 : null); });
  const tGes = temGes() ? DB.casos.filter(c => !migrado(c) && c.origem!=='GESUAS' && noPeriodo(c.inicio_acomp, P)).map(c => {
    const s = statusGes(c); if (!s || s.tipo!=='ok') return null; const d = diasEntre(c.inicio_acomp, dataBr(s.g.inicio)); return d===null ? null : Math.max(0, d); }) : [];
  const tempos = [['Recebimento → conclusão da avaliação', tAval], ['Conclusão da avaliação → repasse à técnica', tRepasse], ...(temGes()?[['Repasse → inclusão no GESUAS', tGes]]:[])];

  // funil do que entrou no período
  const indicados = C.filter(c => desfechoAval(c)==='Indicado acompanhamento' || c.inicio_acomp);

  const funil = [['Recebidos', C.length], ['Passaram pela avaliação social', C.filter(c => c.passou_avaliacao).length], ['Avaliação concluída', C.filter(c => fimAvaliacao(c)).length],
    ['Indicados para acompanhamento', indicados.length], ...(noGes?[['Em acompanhamento no GESUAS', noGes.length]]:[])];

  // desfechos e remetentes
  const desf = cont(aval.map(desfechoAval));
  const confirm = pct(aval.filter(c => desfechoAval(c)==='Indicado acompanhamento').length, aval.length);
  const rems = cont(C.map(c => c.remetente || 'Sem remetente')).slice(0,10).map(([r,n]) => {
    const av = aval.filter(c => (c.remetente||'Sem remetente')===r);
    return {r, n, av:av.length, acomp:pct(av.filter(c => desfechoAval(c)==='Indicado acompanhamento').length, av.length), nc:pct(av.filter(c => desfechoAval(c)==='Não confirmado').length, av.length)}; });

  // violações, registros, reincidência
  const grp = cont(C.flatMap(c => c.diagnostico.map(k => DIAG_GRUPO[k])));
  const tip = cont(C.flatMap(c => c.diagnostico.map(k => DIAG_LABEL[k]))).slice(0,8);
  const regs = DB.casos.flatMap(c => c.registros.filter(r => noPeriodo(r.data, P)));
  const regTipo = cont(regs.map(r => r.tipo));
  const ehVD = r => /(^|\W)VD(\W|$)|visita/i.test(r.tipo) && !/tentativa/i.test(r.tipo);
  const regAval = aval.filter(c => !migrado(c));
  const mediaReg = regAval.length ? (regAval.reduce((s,c) => s + c.registros.length, 0)/regAval.length).toFixed(1).replace('.',',') : null;
  const comVD = pct(regAval.filter(c => c.registros.some(ehVD)).length, regAval.length);
  const reinc = reincidentes(C);

  // carga por técnica, a partir do GESUAS
  let carga = [];
  if (coord() && temGes()){
    const casoDe = new Map(); DB.casos.forEach(c => { const s = statusGes(c); if (s && s.tipo==='ok') casoDe.set(s.g, c); });
    const aguard = DB.casos.filter(c => { const s = statusGes(c); return s && (s.tipo==='ausente' || s.tipo==='possivel'); });
    carga = tecnicasGes().map(t => { const L = DB.ges.linhas.filter(g => primeiroNome(g.tecnico)===t.k);
      return {nome:nomeTecnica(t.nome), fam:L.length, peso:L.reduce((s,g) => s + (Number((casoDe.get(g)||{}).complexidade) || 1), 0), paf:pct(L.filter(g => g.paf==='Preenchido').length, L.length), aguard:aguard.filter(c => primeiroNome(c.tecnica)===t.k).length}; })
      .filter(t => t.fam || t.aguard).sort((a,b) => b.peso-a.peso);
  }
  // atendimentos importados do GESUAS
  const atP = temAtend() ? DB.atend.filter(a => noPeriodo(a.data, P)) : [];
  const atMes = P.meses.map(m => ({l:m.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''), ano:m.getFullYear(), n:atP.filter(a => { const d = D(a.data); return d.getFullYear()===m.getFullYear() && d.getMonth()===m.getMonth(); }).length}));
  const maxA = Math.max(1, ...atMes.map(x => x.n));
  const prod = cont(atP.map(a => nomeTecnica(a.tecnico))).map(([t,n]) => { const fams = new Set(atP.filter(a => nomeTecnica(a.tecnico)===t).map(a => a.cpf || norm(a.responsavel))).size; return {t, n, fams}; });
  const t1Atend = temAtend() && temGes() ? DB.casos.filter(c => !migrado(c) && c.origem!=='GESUAS' && noPeriodo(c.inicio_acomp, P)).map(c => {
    const s = statusGes(c); if (!s || s.tipo!=='ok') return null; const a = atendimentosDaFamilia(s.g).find(a => a.data >= c.inicio_acomp); return a ? diasEntre(c.inicio_acomp, a.data) : null; }) : [];
  // território: bairro digitado no caso ou, se vazio, o do GESUAS
  const bairroDe = c => { if (c.bairro) return TIT(c.bairro); const s = temGes() ? statusGes(c) : null; return s && s.tipo==='ok' && s.g.bairro ? TIT(s.g.bairro) : ''; };
  const terr = cont(C.map(bairroDe)), semBairro = C.filter(c => !bairroDe(c)).length;
  const grupos = DIAG.map(g => g.g.replace(/^\d\.\s*/,''));
  const terrViol = terr.slice(0,6).map(([b]) => ({b, n:grupos.map(gr => C.filter(c => bairroDe(c)===b && c.diagnostico.some(k => DIAG_GRUPO[k]===gr)).length)}));

    <div class="kpi"><span>Encaminhamentos recebidos</span><b>${C.length}</b></div>

    ${temAtend()&&temGes()?`<div class="kpi"><span>Repasse até o 1º atendimento no GESUAS (mediana)</span><b>${fd(mediana(t1Atend))}</b></div>`:''}

  </div>
  <div class="charts">
    <section class="panel stack"><h2>Encaminhamentos por mês</h2>
      <div><div class="vbars">${porMes.map(x => `<div class="vbar" title="${x.l}/${String(x.ano).slice(2)}: ${x.n} · mesmo mês de ${x.ano-1}: ${x.ant}"><em>${x.n}</em><i style="height:${x.n/maxM*100}%"></i>${x.ant?`<s style="bottom:${x.ant/maxM*100}%"></s>`:''}</div>`).join('')}</div>
      <div class="xl">${porMes.map(x => `<span>${x.l}</span>`).join('')}</div></div>
      <div class="legenda"><span><i class="lg-barra"></i>Mês</span><span><i class="lg-ref"></i>Mesmo mês do ano anterior</span></div></section>
    <section class="panel stack"><h2>Caminho dos encaminhamentos</h2>${hb(funil, C.length)}<div class="muted" style="font-size:12px">Do total recebido no período. Casos enviados direto para o acompanhamento não passam pela avaliação.</div></section>
    <section class="panel stack"><h2>Tempo em cada etapa</h2>
      <table style="min-width:0"><thead><tr><th>Etapa</th><th style="text-align:right">Mediana</th><th style="text-align:right">Casos</th></tr></thead><tbody>
      ${tempos.map(([l,v]) => { const n = v.filter(x => x!==null && x>=0).length, m = mediana(v); return `<tr style="cursor:default"><td>${l}</td><td class="mono" style="text-align:right">${m===null?'—':m+' dias'}</td><td class="mono" style="text-align:right">${n}</td></tr>`; }).join('')}</tbody></table>
      <div class="muted" style="font-size:12px">Mediana: metade dos casos levou menos que isso. Casos migrados da planilha antiga ficam de fora.</div></section>
    <section class="panel stack"><h2>Desfecho das avaliações concluídas</h2>${hb(desf, aval.length)}</section>
    <section class="panel stack" style="grid-column:1/-1"><h2>Por remetente</h2>
      ${rems.length?`<div style="overflow-x:auto"><table style="min-width:0"><thead><tr><th>Remetente</th><th style="text-align:right">Recebidos</th><th style="text-align:right">Avaliações concluídas</th><th style="text-align:right">Indicaram acompanhamento</th><th style="text-align:right">Não confirmados</th></tr></thead><tbody>
      ${rems.map(x => `<tr style="cursor:default"><td>${esc(x.r)}</td><td class="mono" style="text-align:right">${x.n}</td><td class="mono" style="text-align:right">${x.av}</td><td class="mono" style="text-align:right">${x.acomp===null?'—':x.acomp+'%'}</td><td class="mono" style="text-align:right">${x.nc===null?'—':x.nc+'%'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Sem dados no período.</div>'}
      <div class="muted" style="font-size:12px">Mostra quanto do que cada órgão encaminha se confirma como violação que justifica acompanhamento.</div></section>
    <section class="panel stack"><h2>Por grupo de violação</h2>${hb(grp)}<div class="muted" style="font-size:12px">Das marcações da ficha de avaliação dos casos recebidos no período.</div></section>
    <section class="panel stack"><h2>Situações mais frequentes</h2>${hb(tip)}</section>
    <section class="panel stack"><h2>Registros de atendimento</h2>
      <div class="row" style="gap:18px"><div><span class="label">Por avaliação concluída</span><div style="font-size:20px;font-weight:700">${mediaReg===null?'—':mediaReg}</div></div><div><span class="label">Avaliações com visita domiciliar</span><div style="font-size:20px;font-weight:700">${comVD===null?'—':comVD+'%'}</div></div></div>
      ${hb(regTipo)}</section>
    ${temAtend()?`<section class="panel stack"><h2>Atendimentos registrados no GESUAS</h2>
      <div><div class="vbars">${atMes.map(x => `<div class="vbar" title="${x.l}/${String(x.ano).slice(2)}: ${x.n} atendimentos"><em>${x.n}</em><i style="height:${x.n/maxA*100}%"></i></div>`).join('')}</div>
      <div class="xl">${atMes.map(x => `<span>${x.l}</span>`).join('')}</div></div>
      <div class="muted" style="font-size:12px">Do relatório Famílias Atendidas por Técnico. Meses antes de ${fmt(atendIdx().min)} não foram importados.</div></section>
    <section class="panel stack"><h2>Produção por técnica</h2>
      ${prod.length?`<div style="overflow-x:auto"><table style="min-width:0"><thead><tr><th>Técnica</th><th style="text-align:right">Atend.</th><th style="text-align:right">Famílias</th></tr></thead><tbody>
      ${prod.map(x => `<tr style="cursor:default" title="${(x.n/x.fams).toFixed(1).replace('.',',')} atendimentos por família"><td>${esc(x.t)}</td><td class="mono" style="text-align:right">${x.n}</td><td class="mono" style="text-align:right">${x.fams}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Sem atendimentos no período.</div>'}
      <div class="muted" style="font-size:12px">Atendimentos registrados no GESUAS no período, e famílias diferentes atendidas. Passe o mouse na linha para ver a média por família.</div></section>`:''}
    <section class="panel stack"><h2>Por território</h2>${hb(terr.filter(x => x[0]).slice(0,10))}
      <div class="muted" style="font-size:12px">Encaminhamentos recebidos no período, pelo bairro do caso ou, se vazio, pelo do GESUAS.${semBairro?` ${semBairro} sem bairro.`:''}</div></section>
    ${terrViol.some(x => x.b)?`<section class="panel stack" style="grid-column:1/-1"><h2>Território × violação</h2>
      <div style="overflow-x:auto"><table style="min-width:0"><thead><tr><th>Bairro</th>${grupos.map(g => `<th style="text-align:right">${esc(g)}</th>`).join('')}</tr></thead><tbody>
      ${terrViol.filter(x => x.b).map(x => `<tr style="cursor:default"><td>${esc(x.b)}</td>${x.n.map((n,i) => `<td class="mono calor" style="text-align:right;--a:${n/maxTV}" title="${esc(x.b)} · ${esc(grupos[i])}: ${n}">${n||''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <div class="muted" style="font-size:12px">Casos recebidos no período, nos bairros com mais encaminhamentos. Um caso pode ter mais de um grupo de violação. Cor mais forte, mais casos.</div></section>`:''}
    ${terrGes.some(x => x[0])?`<section class="panel stack"><h2>Famílias em acompanhamento por território</h2>${hb(terrGes.filter(x => x[0]))}<div class="muted" style="font-size:12px">Do relatório Acompanhamentos do GESUAS. Situação atual.</div></section>`:''}
    ${carga.length?`<section class="panel stack" style="grid-column:1/-1"><h2>Carga por técnica</h2>
      <div style="overflow-x:auto"><table style="min-width:0"><thead><tr><th>Técnica</th><th style="text-align:right">Famílias</th><th style="text-align:right">Carga</th><th style="text-align:right">PAF ok</th><th style="text-align:right">Aguardando</th></tr></thead><tbody>
      ${carga.map(t => `<tr style="cursor:default"><td>${esc(t.nome)}</td><td class="mono" style="text-align:right">${t.fam}</td><td class="mono" style="text-align:right">${String(t.peso).replace('.',',')}</td><td class="mono" style="text-align:right">${t.paf===null?'—':t.paf+'%'}</td><td class="mono" style="text-align:right;${t.aguard?'color:var(--crit);font-weight:600':''}">${t.aguard}</td></tr>`).join('')}</tbody></table></div>
      <div class="muted" style="font-size:12px">Famílias no GESUAS. PAF ok: com PAF preenchido. Aguardando: repassadas e ainda não incluídas. Carga soma a complexidade de cada família (baixa 0,5 · média 1 · alta 1,5). Famílias sem caso no sistema contam como média. Situação atual, não depende do período.</div></section>`:''}
    <section class="panel stack"><h2>Famílias que já tinham caso</h2>
      ${reinc.length?`<div class="muted" style="font-size:12.5px">${reinc.length} dos ${C.length} encaminhamentos do período são de vítimas ou famílias com caso anterior.</div>
      <div class="alist">${reinc.slice(0,8).map(x => `<div class="aitem" data-caso="${x.c.id}" tabindex="0"><div class="sev info"></div><div><div class="nm">${esc(nomeCaso(x.c))} <span class="mono muted">${x.c.id}</span></div><div class="muted" style="font-size:12.5px">Caso anterior: ${x.ant.id} · ${esc(x.ant.desfecho||ETAPAS[x.ant.etapa]||'')}</div></div><span></span></div>`).join('')}</div>`:'<div class="empty">Nenhum encaminhamento de família já conhecida no período.</div>'}</section>
  </div>`;
}

/* ================= render + eventos ================= */
function render(){
  renderNav();
  const m = $('#main');
  if (!coord() && ['novo','acompanhamento','gesuas'].includes(S.view)) S.view='painel';
  m.innerHTML = S.view==='painel'?vPainel(): S.view==='novo'?vNovo(): S.view==='casos'?vCasos(): S.view==='avaliacao'?vCasos('avaliacao'): S.view==='acompanhamento'?vCasos('acompanhamento'): S.view==='caso'?vCaso(): S.view==='gesuas'?vGesuas(): vInd();
  bind();
}
function bind(){
  const m = $('#main');
  m.querySelectorAll('[data-caso]').forEach(el => { const open = e => { e.preventDefault(); go('caso',{caso:el.dataset.caso, tab:'dados', prev: S.view==='caso'?S.prev:S.view}); }; el.onclick=open; el.onkeydown=e => { if (e.key==='Enter') open(e); }; });
  m.querySelectorAll('[data-list]').forEach(el => el.onclick = () => { const k=el.dataset.list; if (k==='avaliacao'||k==='acompanhamento') go(k); else go('casos',{filtroEtapa:k}); });
  m.querySelectorAll('[data-go2]').forEach(el => el.onclick = () => go(el.dataset.go2));
  m.querySelectorAll('[data-gtec]').forEach(el => el.onclick = () => go('gesuas',{gTec:el.dataset.gtec}));
  m.querySelectorAll('[data-act="novo"]').forEach(el => el.onclick = () => { S.draft=null; S.editando=null; go('novo'); });
  m.querySelectorAll('[data-seg]').forEach(el => el.onclick = () => { S.filtroEtapa=el.dataset.seg; render(); });
  m.querySelectorAll('[data-per]').forEach(el => el.onclick = () => { S.indPer=el.dataset.per; render(); });
  const b = $('#busca'); if (b) b.oninput = () => { S.busca=b.value; const pos=b.selectionStart; render(); const nb=$('#busca'); nb.focus(); nb.setSelectionRange(pos,pos); };
  const back = m.querySelector('[data-back]'); if (back) back.onclick = () => go(S.prev||'casos');
  const ed = m.querySelector('[data-editar]'); if (ed) ed.onclick = () => { S.editando=S.caso; S.draft=null; go('novo'); };
  const ip = m.querySelector('[data-imprimir]'); if (ip) ip.onclick = () => imprimirFicha(DB.casos.find(x => x.id===S.caso));
  m.querySelectorAll('[data-tab]').forEach(el => el.onclick = () => { S.tab=el.dataset.tab; render(); });
  const c = DB.casos.find(x => x.id===S.caso);
  m.querySelectorAll('[data-out]').forEach(el => el.onclick = () => acao(c, el.dataset.out));
  const rb = m.querySelector('[data-reabrir]'); if (rb) rb.onclick = () => modal(`<h2>Reabrir caso</h2><p style="margin:0">O caso volta para "Aguardando triagem".</p>`, async () => {
    Object.assign(c, {etapa:'triagem', desfecho:'', desfecho_data:'', desfecho_obs:'', desligamento:''}); salvar(c, 'Caso reaberto', 'api_reabrir', [c.id]); return c; });
  const pk = m.querySelector('[data-prazook]'); if (pk) pk.onclick = () => { c.prazo_respondido = true; salvar(c, 'Prazo respondido', 'api_prazoRespondido', [c.id]); render(); };
  m.querySelectorAll('[data-diag]').forEach(el => el.onchange = () => {
    const k=el.dataset.diag; if (el.checked){ if (!c.diagnostico.includes(k)) c.diagnostico.push(k); } else c.diagnostico = c.diagnostico.filter(x => x!==k);
    salvar(c, 'Diagnóstico', 'api_diagnostico', [c.id, c.diagnostico.slice()], 'diag:'+c.id);
  });
  const fr = $('#fReg'); if (fr) fr.onsubmit = e => { e.preventDefault(); const t=$('#r_txt').value.trim(); if (!t){ toast('Escreva a evolução antes de adicionar.'); return; }
    const reg = {id:idUnico(), data:$('#r_data').value||iso(HOJE), tipo:$('#r_tipo').value, texto:t, autor:coord()?'Coordenação':'Avaliação social'};
    c.registros.push(reg); c.registros.sort((a,b) => a.data < b.data ? -1 : 1);
    $('#r_txt').value=''; salvar(c, `Registro: ${reg.tipo}`, 'api_registro', [c.id, reg], null, t); render(); };
  const fd = $('#fDisc'); if (fd) fd.onsubmit = e => { e.preventDefault(); const t=$('#disc_txt').value.trim(); if (!t) return;
    const d = {id:idUnico(), data:$('#disc_data').value||iso(HOJE), texto:t};
    c.discussoes.push(d); c.discussoes.sort((a,b) => a.data < b.data ? -1 : 1);
    $('#disc_txt').value=''; salvar(c, 'Discussão de caso', 'api_discussao', [c.id, t, d.data, d.id], null, t); render(); };
  ['#a_tec','#a_cx'].forEach(s => { const el=$(s); if (el) el.onchange = () => {
    if ($('#a_tec')) c.tecnica = $('#a_tec').value; c.complexidade = Number($('#a_cx').value) || c.complexidade;
    salvar(c, 'Técnica e complexidade', 'api_acompanhamento', [c.id, c.tecnica, $('#a_cx').value], 'acomp:'+c.id); render(); }; });
  // GESUAS
  m.querySelectorAll('[data-gv]').forEach(el => el.onclick = e => {
    e.stopPropagation();
    const cc = DB.casos.find(x => x.id===el.dataset.gcaso);
    if (el.dataset.gv==='manual') return buscarNoGesuas(cc);
    vincularGesuas(cc, el.dataset.gv, el.dataset.gnome); render();
  });
  const gt = $('#gTec'); if (gt) gt.onchange = () => { S.gTec=gt.value; render(); };
  const gf = $('#gFile'); if (gf) gf.onchange = async () => {
    if (!gf.files.length) return;
    $('#gStatus').textContent = 'Lendo os arquivos…';
    try {
      S.gPrevia = await montarPrevia([...gf.files]); render();
    } catch(err){ $('#gStatus').textContent = err.message; $('#gStatus').style.color='var(--crit)'; }
  };
  m.querySelectorAll('[data-saida]').forEach(el => el.onchange = () => { if (el.checked) S.gPrevia.desligar.add(el.dataset.saida); else S.gPrevia.desligar.delete(el.dataset.saida); });
  const gs = $('#gSalvar'); if (gs) gs.onclick = async () => { gs.disabled=true;
    try {
      const P = S.gPrevia;
      const r = await run('api_importarGesuas', {ges:P.ges||null, desligar:[...P.desligar], completar:P.completar, atendimentos:P.atendimentos});
      DB.ges = r.ges; DB.atend = atendObj(r.atend); r.casos.forEach(substituir); S.gPrevia=null; S.gTec='';
      const desl = r.casos.filter(c => P.desligar.has(c.id)).length;
      toast([P.ges?`${DB.ges.linhas.length} famílias salvas`:'', desl?`${desl} desligada${desl>1?'s':''}`:'', P.atendimentos.length?`${r.novos} atendimentos novos`:''].filter(Boolean).join(' · ')); render();
    } catch(e){ gs.disabled=false; } };
  m.querySelectorAll('[data-sgv]').forEach(el => el.onclick = () => vincularLinhaModal(DB.ges.linhas[+el.dataset.sgv]));
  m.querySelectorAll('[data-sgc]').forEach(el => el.onclick = async () => { el.disabled = true;
    try { const c = await criarCasoDoGesuas(DB.ges.linhas[+el.dataset.sgc]); substituir(c); render(); } catch(e){ el.disabled = false; } });
  const gd = $('#gDescartar'); if (gd) gd.onclick = () => { S.gPrevia=null; render(); };
  m.querySelectorAll('[data-copy]').forEach(el => el.onclick = () => {
    const ta = $('#msg_'+el.dataset.copy); const txt = ta.value;
    const fallback = () => { ta.hidden=false; ta.style.minHeight='180px'; ta.focus(); ta.select(); toast('Texto selecionado. Use Ctrl+C para copiar.'); };
    try { navigator.clipboard.writeText(txt).then(() => toast('Mensagem copiada. Cole no WhatsApp ou e-mail.'), fallback); } catch(e){ fallback(); }
  });
  // formulário
  const fn = $('#fNovo'); if (fn){
    const Dd = draft();
    fn.querySelectorAll('[data-k]').forEach(el => { el.oninput = el.onchange = () => { Dd[el.dataset.k]=el.value; if (el.dataset.k==='responsavel') atualizarDup(); }; });
    fn.querySelectorAll('[data-v]').forEach(el => { el.oninput = el.onchange = () => { Dd.pessoas[+el.dataset.v][el.dataset.vk] = el.value; if (el.dataset.vk==='nome') atualizarDup(); }; });
    fn.querySelectorAll('input[name="destino"]').forEach(el => el.onchange = () => { Dd.destino=el.value; render(); });
    fn.querySelectorAll('[data-delv]').forEach(el => el.onclick = () => { Dd.pessoas.splice(+el.dataset.delv,1); render(); });
    $('#addV').onclick = () => { Dd.pessoas.push({nome:'',nascimento:'',sexo:''}); render(); };
    $('#cancelar').onclick = () => { const id=S.editando; S.draft=null; S.editando=null; if (id) go('caso',{caso:id}); else render(); };
    fn.onsubmit = e => { e.preventDefault(); salvarNovo(); };
    bindDup();
  }
}
function bindDup(){ document.querySelectorAll('#dupBox [data-caso]').forEach(el => el.onclick = e => { e.preventDefault(); go('caso',{caso:el.dataset.caso, tab:'dados', prev:'novo'}); }); }

/* ================= início ================= */
const atendObj = L => (L||[]).map(a => ({tecnico:a[0], responsavel:a[1], cpf:a[2], bairro:a[3], data:a[4]}));
function iniciarTema(){
  const sel = $('#tema'); if (!sel) return;
  sel.value = document.documentElement.dataset.theme || '';
  sel.onchange = () => {
    const t = sel.value;
    if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
    try { if (t) localStorage.setItem('tema', t); else localStorage.removeItem('tema'); } catch(e){}
  };
}
iniciarTema();
iniciarFila();
iniciarCopiar();
function iniciar(){
  google.script.run
    .withSuccessHandler(r => {
      DB = r; DB.atend = atendObj(r.atend); const h = D(r.hoje); if (h) HOJE = h;
      $('#carregando').remove(); $('#app').hidden = false;
      $('#whoami').innerHTML = `<b>${coord()?'Coordenação':'Avaliação social'}</b>${esc(r.email)}`;
      render();
    })
    .withFailureHandler(e => {
      $('#carregando').innerHTML = `<div class="erro-total panel"><h2>Não foi possível abrir o sistema</h2><p>${esc(e && e.message ? e.message : e)}</p></div>`;
    })
    .api_iniciar();
}
iniciar();
</script>
